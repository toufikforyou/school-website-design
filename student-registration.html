<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Student Registration form</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <style type="text/css">
      @import url("https://fonts.maateen.me/bangla/font.css");
      * {
        padding: 0;
        margin: 0;
      }
      body {
        background: rgba(0, 60, 250, 0.5);
        font-family: "Bangla", sans-serif;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .logIn_form {
        background: rgba(0, 98, 0, 0.7);
        max-width: 700px;
        border-radius: 5px;
        margin: 20px auto;
        border: 2px solid #fff;
      }
      .header {
        text-align: center;
        text-transform: uppercase;
        margin-top: 20px;
        margin-bottom: 30px;
        font-size: 20px;
        color: white;
        font-weight: 500;
        border-bottom: 3px solid #f05925;
      }
      .input_style {
        width: 90%;
        margin: auto;
      }
      .click_box {
        color: white;
        font-weight: 500;
      }
      .btn_style {
        width: 100%;
        margin: 0 auto;
        font-weight: 500;
        margin-bottom: 10px;
        text-transform: uppercase;
      }
      a {
        color: #00ff4e;
        text-decoration: none;
      }
      a:hover {
        color: #200554;
        text-decoration: none;
      }
      @media screen and (max-width: 700px) {
        .input_style {
          width: 90%;
        }
      }
      @media screen and (max-width: 600px) {
        .input_style {
          width: 90%;
          margin-top: 30px;
        }
      }
      @media screen and (max-width: 500px) {
        .input_style {
          width: 90%;
        }
        .btn_style,
        .btn_style1 {
          font-size: 12px;
        }
      }
      @media screen and (max-width: 400px) {
        .input_style {
          width: 95%;
        }
        .btn_style,
        .btn_style1 {
          font-size: 8px;
        }
        .header {
          font-size: 18px;
        }
      }
      @media screen and (max-width: 350px) {
        .input_style {
          width: 95%;
        }
        .btn_style,
        .btn_style1 {
          font-size: 8px;
        }
        .header {
          font-size: 18px;
        }
      }
      @media screen and (max-width: 300px) {
        .input_style {
          width: 95%;
        }
        .btn_style,
        .btn_style1 {
          font-size: 8px;
        }
        .header {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logIn_form">
        <div class="header">
          <span>ছাত্র-ছাত্রী লগইন ফর্ম</span>
        </div>
        <div class="input_style">
          <form>
            <div class="form-group click_box">
              <label>স্টুডেন্ট আইডি অথবা মোবাইল</label>
              <input
                placeholder="স্টুডেন্ট আইডি অথবা মোবাইল"
                type="number"
                class="form-control abbr"
                id="exampleInputEmail1"
                aria-describedby="emailHelp"
              />
            </div>
            <div class="form-group click_box">
              <label>পাসওয়ার্ড</label>
              <input
                placeholder="পাসওয়ার্ড"
                type="password"
                class="form-control"
                id="exampleInputPassword1"
              />
            </div>
            <div class="form-group click_box">
              <label>পুনরায় পাসওয়ার্ড</label>
              <input
                placeholder="পুনরায় পাসওয়ার্ড"
                type="password"
                class="form-control"
                id="exampleInputPassword1"
              />
            </div>
            <button type="button" class="btn btn-primary btn_style">
              অ্যাকাউন্ট করুন
            </button>
            <a href="student-login.html" class="account">লগইন করুন</a>
            <br />
            <br />
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
